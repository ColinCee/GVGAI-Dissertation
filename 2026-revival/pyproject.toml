[project]
name = "gvgai-revival"
version = "0.1.0"
description = "2026 rerun of the 2018 GVGAI DQN dissertation"
requires-python = ">=3.14,<3.15"  # 3.15: no torch.compile yet
dependencies = [
    "gymnasium>=1.2",
    "numpy>=2.5",
    "pillow>=13",
    "psutil>=7.2.2",
    "torch>=2.14",
    "triton-windows>=3.8; sys_platform == 'win32'",  # torch.compile's GPU kernels
]

[dependency-groups]
dev = ["ruff>=0.17", "ty>=0.0.89"]

# CUDA torch on Windows, where training runs; CPU-only torch on Linux (CI and checks), which has no GPU and no room
# for the CUDA wheels.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["gvgai/vendor", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ty.src]
exclude = ["gvgai/vendor", "runs"]

[tool.ty.environment]
extra-paths = ["gvgai/vendor", "engine"]
